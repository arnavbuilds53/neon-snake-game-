<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070709;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{letter-spacing:4px;font-size:22px;margin:6px;text-shadow:0 0 15px #7c3aed}
.top{display:flex;gap:18px;margin:10px;color:#aaa;font-size:13px}
.top b{color:#fff}
#game{border:2px solid #222;border-radius:18px;box-shadow:0 0 40px rgba(124,58,237,.4);background:#0f0f12}
.controls{margin-top:16px;display:grid;grid-template-columns:60px 60px 60px;gap:8px}
.controls button{width:60px;height:60px;border-radius:14px;border:1px solid #333;background:#1a1a1e;color:#fff;font-size:22px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{padding:10px 20px;border-radius:999px;border:none;font-weight:700}
.btn-w{background:#fff;color:#000}
.btn-d{background:#27272a;color:#fff}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;flex-direction:column}
#overlay.show{display:flex}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<div class="top"><span>Score:<b id="score">0</b></span><span>High:<b id="high">0</b></span></div>
<canvas id="game" width="360" height="360"></canvas>
<div class="controls"><div></div><button onclick="setDir(0,-1)">↑</button><div></div><button onclick="setDir(-1,0)">←</button><button onclick="setDir(0,1)">↓</button><button onclick="setDir(1,0)">→</button></div>
<div class="row"><button class="btn btn-w" onclick="restart()">Restart</button><button class="btn btn-d" onclick="togglePause()" id="pauseBtn">Pause</button></div>
<div id="overlay"><h2>Game Over</h2><p id="overScore"></p><br><button class="btn btn-w" onclick="restart()">Play Again</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),highEl=document.getElementById('high');
let grid=18,size=20,snake,dir,nextDir,food,score,high=localStorage.getItem('snakeHigh')||0,loop,paused=false;
highEl.textContent=high;
function init(){snake=[{x:9,y:9}];dir={x:1,y:0};nextDir={x:1,y:0};placeFood();score=0;paused=false;scoreEl.textContent=0;document.getElementById('overlay').classList.remove('show');clearInterval(loop);loop=setInterval(update,110);draw();}
function placeFood(){food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)};if(snake.some(s=>s.x==food.x&&s.y==food.y))placeFood();}
function setDir(x,y){if(paused)return;if(dir.x==-x&&dir.y==-y)return;nextDir={x,y};}
function update(){if(paused)return;dir=nextDir;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0)h.x=grid-1;if(h.x>=grid)h.x=0;if(h.y<0)h.y=grid-1;if(h.y>=grid)h.y=0;if(snake.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(loop);document.getElementById('overScore').textContent='Score:'+score;document.getElementById('overlay').classList.add('show');return;}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score+=10;scoreEl.textContent=score;if(score>high){high=score;highEl.textContent=high;localStorage.setItem('snakeHigh',high);}placeFood();}else snake.pop();draw();}
function draw(){ctx.clearRect(0,0,360,360);ctx.shadowColor='#22c55e';ctx.shadowBlur=18;ctx.fillStyle='#22c55e';ctx.fillRect(food.x*size+4,food.y*size+4,size-8,size-8);ctx.shadowBlur=0;snake.forEach((s,i)=>{if(i==0){ctx.fillStyle='#fff';ctx.shadowColor='#7c3aed';ctx.shadowBlur=20;}else{ctx.fillStyle='#7c3aed';ctx.shadowBlur=0;}ctx.fillRect(s.x*size+2,s.y*size+2,size-4,size-4);});ctx.shadowBlur=0;}
function restart(){init();}function togglePause(){paused=!paused;document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';}
document.addEventListener('keydown',e=>{if(e.key=='ArrowUp')setDir(0,-1);if(e.key=='ArrowDown')setDir(0,1);if(e.key=='ArrowLeft')setDir(-1,0);if(e.key=='ArrowRight')setDir(1,0);});
let sx,sy;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);});
init();
</script>
</body>
  </html>
